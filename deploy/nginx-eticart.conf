# EtiCart / neotic.com.tr
# HTTP → HTTPS ve www → apex yönlendirmesi.
# Certbot sertifika yollarını korur; yenileme için ACME konumu açıktır.

# Tüm HTTP istekleri HTTPS ana domaine.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name neotic.com.tr www.neotic.com.tr 31.58.245.233 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/eticart/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://neotic.com.tr$request_uri;
    }
}

# www HTTPS → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.neotic.com.tr;

    ssl_certificate /etc/letsencrypt/live/neotic.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotic.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://neotic.com.tr$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name neotic.com.tr;

    root /var/www/eticart/public;
    index index.php index.html index.htm;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    ssl_certificate /etc/letsencrypt/live/neotic.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotic.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
